name: Build Chrome extension
on:
  push:
    tags: ["ext-v*"]    # pushing e.g. ext-v0.2.0 tests, zips and publishes the extension
  workflow_dispatch:    # Actions tab > Run workflow
    inputs:
      tag:
        description: "Release tag to publish, e.g. ext-v0.2.0 (leave blank for a test build kept only as a download on the run page)"
        required: false
        default: ""
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The JS reader must reproduce shared/out.json (made by the Python app) from shared/mock_data.xlsx.
      - name: Test
        run: npm test
        working-directory: extension
      - name: Stamp the version and zip
        id: pack
        run: |
          VERSION=$(echo "$TAG" | grep -oE '[0-9]+(\.[0-9]+){0,3}' | head -1)
          if [ -z "$VERSION" ]; then VERSION=$(node -p "require('./extension/manifest.json').version"); fi
          node -e "const fs=require('fs');const p='extension/manifest.json';const m=JSON.parse(fs.readFileSync(p));m.version='$VERSION';fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"
          cd extension
          zip -r "../ClaimFiller-extension-$VERSION.zip" manifest.json background.js panel.html panel.css panel.js src vendor -x "*.DS_Store"
          echo "zip=ClaimFiller-extension-$VERSION.zip" >> "$GITHUB_OUTPUT"
      - name: Publish to the release page
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: true   # keeps "latest" pointing at the Windows/Mac app release
          files: ${{ steps.pack.outputs.zip }}
      - name: Keep as a download on this run (test builds)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ClaimFiller-extension
          path: ${{ steps.pack.outputs.zip }}
