name: Build ClaimFiller
on:
  push:
    tags: ["v*"]      # pushing a tag builds and publishes a release
  workflow_dispatch:  # Actions tab > Run workflow
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.3 (leave blank for a test build that is only kept as a download on the run page)"
        required: false
        default: ""
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl playwright pyinstaller
      - run: pyinstaller --onefile --windowed --name ClaimFiller --collect-all playwright app.py
      - name: Publish to the release page
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/ClaimFiller.exe
            config.json
      - name: Keep as a download on this run (test builds)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ClaimFiller-windows
          path: |
            dist/ClaimFiller.exe
            config.json

  mac:
    needs: windows   # run after the Windows job so both don't create the same release at once
    runs-on: macos-latest   # Apple Silicon build; see CLAUDE.md for Intel Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl playwright pyinstaller
      # --windowed on macOS produces ClaimFiller.app; zip it with ditto to keep it launchable.
      - run: pyinstaller --windowed --name ClaimFiller --collect-all playwright app.py
      - run: ditto -c -k --keepParent dist/ClaimFiller.app dist/ClaimFiller-mac.zip
      - name: Publish to the release page
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/ClaimFiller-mac.zip
      - name: Keep as a download on this run (test builds)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ClaimFiller-mac
          path: dist/ClaimFiller-mac.zip
