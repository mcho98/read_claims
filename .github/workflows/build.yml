name: Build ClaimFiller
# PAUSED: the Windows/Mac app is not built on releases for now; only the extension zip is
# (build-extension.yml). To switch it back on, uncomment the `push:` trigger below.
# It can still be run by hand from the Actions tab (Run workflow).
on:
  # push:
  #   tags: ["app-v*", "v*"]   # pushing a tag builds and publishes a release (extension tags are ext-v*)
  workflow_dispatch:  # Actions tab > Run workflow
    inputs:
      tag:
        description: "Release tag to publish, e.g. app-v1.0.3 (leave blank for a test build that is only kept as a download on the run page)"
        required: false
        default: ""
permissions:
  contents: write
# The extension workflow adds its zip to the same release; run one tag's workflows one after the other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl playwright pyinstaller
        working-directory: python-app
      - run: pyinstaller --onefile --windowed --name ClaimFiller --collect-all playwright app.py
        working-directory: python-app
      - name: Publish to the release page
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            python-app/dist/ClaimFiller.exe
            python-app/config.json
      - name: Keep as a download on this run (test builds)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ClaimFiller-windows
          path: |
            python-app/dist/ClaimFiller.exe
            python-app/config.json

  mac:
    needs: windows   # run after the Windows job so both don't create the same release at once
    runs-on: macos-latest   # Apple Silicon build; see CLAUDE.md for Intel Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl playwright pyinstaller
        working-directory: python-app
      # --windowed on macOS produces ClaimFiller.app; zip it with ditto to keep it launchable.
      - run: pyinstaller --windowed --name ClaimFiller --collect-all playwright app.py
        working-directory: python-app
      - run: ditto -c -k --keepParent dist/ClaimFiller.app dist/ClaimFiller-mac.zip
        working-directory: python-app
      - name: Publish to the release page
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: python-app/dist/ClaimFiller-mac.zip
      - name: Keep as a download on this run (test builds)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ClaimFiller-mac
          path: python-app/dist/ClaimFiller-mac.zip
