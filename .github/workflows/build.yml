name: Build ClaimFiller.exe
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl playwright pyinstaller
      - run: pyinstaller --onefile --windowed --name ClaimFiller --collect-all playwright app.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaimFiller.exe
            config.json
